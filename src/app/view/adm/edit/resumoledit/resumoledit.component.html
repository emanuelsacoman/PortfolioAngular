<main class="edit-shell">
  <section class="edit-panel">
    <header class="edit-header">
      <div>
        <p class="eyebrow">Resumo</p>
        <h1>Editar formacao</h1>
      </div>
      <button class="ghost-action" type="button" routerLink="/admin">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
    </header>

    <form class="edit-form" (ngSubmit)="editItem()" [formGroup]="editar" #formDir="ngForm">
      <section class="form-grid">
        <label>
          <span>Periodo</span>
          <input type="text" id="titlel" placeholder="Ex: 2020 - 2024" formControlName="titlel" required>
          <small *ngIf="isInvalidControl('titlel')">Informe o periodo.</small>
        </label>

        <label>
          <span>Ordem</span>
          <input type="number" id="orderl" formControlName="orderl">
        </label>
      </section>

      <section class="form-grid">
        <label>
          <span>Curso ou titulo</span>
          <input type="text" id="descl" placeholder="Nome da formacao" formControlName="descl" required>
          <small *ngIf="isInvalidControl('descl')">Informe a descricao.</small>
        </label>

        <label>
          <span>Instituicao</span>
          <input type="text" id="organizationl" placeholder="Instituicao ou escola" formControlName="organizationl">
        </label>
      </section>

      <section class="form-grid">
        <label>
          <span>Localizacao</span>
          <input type="text" id="locationl" placeholder="Cidade, remoto ou pais" formControlName="locationl">
        </label>

        <label>
          <span>Nivel ou area</span>
          <input type="text" id="levell" placeholder="Tecnico, superior, curso livre..." formControlName="levell">
        </label>
      </section>

      <label>
        <span>Detalhes</span>
        <textarea id="detaill" placeholder="Atividades, enfase, resultados ou contexto" formControlName="detaill" rows="5"></textarea>
      </label>

      <section class="form-grid">
        <label>
          <span>Tags</span>
          <textarea id="tagsText" placeholder="Angular&#10;UX&#10;Arquitetura" formControlName="tagsText" rows="4"></textarea>
        </label>

        <label>
          <span>Certificado ou referencia</span>
          <input type="text" id="linkl" placeholder="https://..." formControlName="linkl">
        </label>
      </section>

      <label class="check-card">
        <input type="checkbox" id="highlightl" formControlName="highlightl">
        <span>Marcar como destaque na timeline</span>
      </label>

      <div class="form-actions">
        <button class="save-action" type="submit">
          <mat-icon>save</mat-icon>
          Salvar
        </button>
        <button class="delete-action" type="button" (click)="delete()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
      </div>
    </form>
  </section>
</main>
