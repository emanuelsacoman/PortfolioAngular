<main class="edit-shell">
  <section class="edit-panel">
    <header class="edit-header">
      <div>
        <p class="eyebrow">Portfolio</p>
        <h1>Editar projeto</h1>
      </div>
      <button class="ghost-action" type="button" routerLink="/admin">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
    </header>

    <form class="edit-form" (ngSubmit)="editItem()" [formGroup]="editar" #formDir="ngForm">
      <section class="toggle-row">
        <label class="toggle-card">
          <span>
            <mat-icon>star</mat-icon>
            Favorito
          </span>
          <mat-slide-toggle class="custom-slide-toggle" formControlName="star" id="star" name="star">
            {{ editar.get('star')?.value ? 'Sim' : 'Nao' }}
          </mat-slide-toggle>
        </label>

        <label class="toggle-card">
          <span>
            <mat-icon>task_alt</mat-icon>
            Projeto finalizado
          </span>
          <mat-slide-toggle class="custom-slide-toggle" formControlName="inProgress" id="inProgress" name="inProgress">
            {{ editar.get('inProgress')?.value ? 'Sim' : 'Nao' }}
          </mat-slide-toggle>
        </label>
      </section>

      <div class="form-grid">
        <label>
          <span>Titulo do projeto</span>
          <input type="text" id="titulo" placeholder="Insira o titulo do projeto" formControlName="titulo" required>
          <small *ngIf="isInvalidControl('titulo')">Informe o titulo.</small>
        </label>

        <label>
          <span>Link do projeto</span>
          <input type="text" id="link" placeholder="https://..." formControlName="link" required>
          <small *ngIf="isInvalidControl('link')">Informe o link.</small>
        </label>
      </div>

      <section class="asset-grid">
        <label class="asset-upload">
          <span>Imagem do projeto</span>
          <input type="file" id="imagem1" formControlName="imagem1" accept="image/*" (change)="uploadFile1($event)">
          <img *ngIf="!imagem1" [src]="projeto && projeto.projectImg" alt="Imagem do projeto">
        </label>

        <label class="asset-upload">
          <span>Icone da tecnologia</span>
          <input type="file" id="imagem2" formControlName="imagem2" accept="image/*" (change)="uploadFile2($event)">
          <img *ngIf="!imagem2" [src]="projeto && projeto.badge" alt="Icone da tecnologia">
        </label>
      </section>

      <div class="form-actions">
        <button class="save-action" type="submit">
          <mat-icon>save</mat-icon>
          Salvar
        </button>
        <button class="delete-action" type="button" (click)="delete()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
      </div>
    </form>
  </section>
</main>
