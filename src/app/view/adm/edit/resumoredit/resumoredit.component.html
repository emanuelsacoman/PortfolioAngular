<main class="edit-shell">
  <section class="edit-panel">
    <header class="edit-header">
      <div>
        <p class="eyebrow">Resumo</p>
        <h1>Editar experiencia</h1>
      </div>
      <button class="ghost-action" type="button" routerLink="/admin">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
    </header>

    <form class="edit-form" (ngSubmit)="editItem()" [formGroup]="editar" #formDir="ngForm">
      <section class="form-grid">
        <label>
          <span>Periodo</span>
          <input type="text" id="titler" placeholder="Ex: 2020 - 2024" formControlName="titler" required>
          <small *ngIf="isInvalidControl('titler')">Informe o periodo.</small>
        </label>

        <label>
          <span>Ordem</span>
          <input type="number" id="orderr" formControlName="orderr">
        </label>
      </section>

      <section class="form-grid">
        <label>
          <span>Experiencia</span>
          <input type="text" id="descr" placeholder="Nome da experiencia" formControlName="descr" required>
          <small *ngIf="isInvalidControl('descr')">Informe a descricao.</small>
        </label>

        <label>
          <span>Empresa ou contexto</span>
          <input type="text" id="companyr" placeholder="Empresa, projeto ou cliente" formControlName="companyr">
        </label>
      </section>

      <section class="form-grid">
        <label>
          <span>Localizacao</span>
          <input type="text" id="locationr" placeholder="Cidade, remoto ou pais" formControlName="locationr">
        </label>

        <label>
          <span>Cargo ou papel</span>
          <input type="text" id="roler" placeholder="Front-end, full-stack, designer..." formControlName="roler">
        </label>
      </section>

      <label>
        <span>Detalhes</span>
        <textarea id="detailr" placeholder="Responsabilidades, entregas, stack e resultados" formControlName="detailr" rows="5"></textarea>
      </label>

      <section class="form-grid">
        <label>
          <span>Tags</span>
          <textarea id="tagsText" placeholder="Angular&#10;Firebase&#10;Performance" formControlName="tagsText" rows="4"></textarea>
        </label>

        <label>
          <span>Referencia</span>
          <input type="text" id="linkr" placeholder="https://..." formControlName="linkr">
        </label>
      </section>

      <label class="check-card">
        <input type="checkbox" id="highlightr" formControlName="highlightr">
        <span>Marcar como destaque na timeline</span>
      </label>

      <div class="form-actions">
        <button class="save-action" type="submit">
          <mat-icon>save</mat-icon>
          Salvar
        </button>
        <button class="delete-action" type="button" (click)="delete()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
      </div>
    </form>
  </section>
</main>
