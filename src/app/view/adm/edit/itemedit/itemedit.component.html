<main class="edit-shell">
  <section class="edit-panel">
    <header class="edit-header">
      <div>
        <p class="eyebrow">Area sobre</p>
        <h1>Editar servico</h1>
      </div>
      <button class="ghost-action" type="button" routerLink="/admin">
        <mat-icon>arrow_back</mat-icon>
        Voltar
      </button>
    </header>

    <form class="edit-form" (ngSubmit)="editItem()" [formGroup]="editar" #formDir="ngForm">
      <div class="form-grid">
        <label>
          <span>Titulo</span>
          <input type="text" id="ctitle" placeholder="Insira o titulo" formControlName="ctitle" required>
          <small *ngIf="isInvalidControl('ctitle')">Informe um titulo valido.</small>
        </label>

        <label>
          <span>Descricao</span>
          <textarea id="cdesc" placeholder="Insira a descricao" formControlName="cdesc" required rows="6"></textarea>
          <small *ngIf="isInvalidControl('cdesc')">Informe uma descricao valida.</small>
        </label>
      </div>

      <section class="asset-panel">
        <label class="file-field">
          <span>Imagem</span>
          <input type="file" id="imagem" formControlName="imagem" accept="image/*" (change)="uploadFile($event)">
        </label>

        <div class="preview-card" *ngIf="!imagem">
          <span>Imagem atual</span>
          <img [src]="sobrearea && sobrearea.cImg" alt="Pre-visualizacao da imagem">
        </div>
      </section>

      <div class="form-actions">
        <button class="save-action" type="submit">
          <mat-icon>save</mat-icon>
          Salvar
        </button>
        <button class="delete-action" type="button" (click)="delete()">
          <mat-icon>delete</mat-icon>
          Excluir
        </button>
      </div>
    </form>
  </section>
</main>
