<div class="contato wrap">
  <div class="top">
    <div class="toph1">{{ title }}</div>
    <div class="topbar"></div>
  </div>

  <div class="formContact">
    <div class="formText" *ngFor="let item of contato">
      <p>{{ item.descContato }}</p>
    </div>

    <div class="onlyForm">
      <div class="success" *ngIf="mensagemEnviada">
        <img loading="lazy" src="./assets/images/check.png" alt="Sucesso!">
      </div>

      <form (ngSubmit)="formSubmitted.emit()" [formGroup]="contactForm" #formDir="ngForm" class="formTrue">
        <div class="form-group">
          <label for="nome">nome*</label>
          <input type="text" id="nome" class="item" formControlName="nome" required maxlength="50">
          <p class="error" *ngIf="isInvalidControl('nome')">Erro no nome</p>
        </div>

        <div class="form-group">
          <label for="email">e-mail*</label>
          <input type="email" id="email" class="item" formControlName="email" required>
          <p class="error" *ngIf="isInvalidControl('email')">Erro no e-mail</p>
        </div>

        <div class="form-group">
          <label for="titulo">titulo/motivo*</label>
          <input type="text" id="titulo" class="item" formControlName="titulo" required maxlength="50">
          <p class="error" *ngIf="isInvalidControl('titulo')">Erro no titulo</p>
        </div>

        <div class="form-group">
          <label for="mensagem">mensagem*</label>
          <textarea id="mensagem" class="item" formControlName="mensagem" required rows="10" cols="30"></textarea>
          <p class="error" *ngIf="isInvalidControl('mensagem')">Erro na mensagem</p>
        </div>

        <button class="sendButton" type="submit">Enviar</button>
      </form>
    </div>
  </div>
</div>
