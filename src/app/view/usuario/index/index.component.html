<app-loading-screen [visible]="isLoading"></app-loading-screen>

<div class="all">
  <h1>{{ profileData.name }}</h1>

  <app-profile-card
    [profiles]="profile"
    [githubProfile]="profileData"
    [profileImageUrl]="profileImageUrl"
    [holidays]="holidayFlags"
    variant="desktop"
    (whatsappRequested)="goToZap($event)"
    (emailRequested)="goToEmail($event)"
    (localRequested)="goToLocal($event)">
  </app-profile-card>

  <app-profile-card
    [profiles]="profile"
    [githubProfile]="profileData"
    [profileImageUrl]="profileImageUrl"
    [holidays]="holidayFlags"
    variant="mobile"
    (whatsappRequested)="goToZap($event)"
    (emailRequested)="goToEmail($event)"
    (localRequested)="goToLocal($event)">
  </app-profile-card>

  <app-portfolio-nav
    [selectedSection]="selectedOption"
    [sobre]="sobre"
    [resumo]="resumo"
    [projeto]="projeto"
    [contato]="contato"
    [isLoggedIn]="isLoggedIn()"
    [adminData]="adminData"
    [responsive]="true"
    (sectionSelected)="selectOption($event)"
    (adminSelected)="goToAdmin($event)">
  </app-portfolio-nav>

  <main class="middle bloco">
    <app-about-section
      *ngIf="isSelected('sobre')"
      [sobre]="sobre"
      [sobrearea]="sobrearea"
      [slider]="slider">
    </app-about-section>

    <app-resume-section
      *ngIf="isSelected('resumo')"
      [resumo]="resumo"
      [resumol]="resumol"
      [resumor]="resumor"
      [chipArray]="chipArray"
      [skillBars]="skillBars">
    </app-resume-section>

    <app-projects-section
      *ngIf="isSelected('projetos')"
      [projeto]="projeto"
      [projetos]="projetos"
      (projectClicked)="registerProjectClick($event)">
    </app-projects-section>

    <app-contact-section
      *ngIf="isSelected('contato')"
      [contato]="contato"
      [contactForm]="contactForm"
      [mensagemEnviada]="mensagemEnviada"
      (formSubmitted)="submit()">
    </app-contact-section>

    <app-portfolio-footer [year]="yearNow" [ownerName]="profileData.name"></app-portfolio-footer>
  </main>

  <app-portfolio-nav
    [selectedSection]="selectedOption"
    [sobre]="sobre"
    [resumo]="resumo"
    [projeto]="projeto"
    [contato]="contato"
    [isLoggedIn]="isLoggedIn()"
    [adminData]="adminData"
    (sectionSelected)="selectOption($event)"
    (adminSelected)="goToAdmin($event)">
  </app-portfolio-nav>
</div>
